name: Ανανέωση Στατιστικών Γλωσσών

on:
  # Τρέχει αυτόματα κάθε μέρα τα μεσάνυχτα
  schedule:
    - cron: "0 0 * * *"
  # Μας επιτρέπει να το τρέξουμε και χειροκίνητα όποτε θέλουμε
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          # Απενεργοποιεί τα βασικά στατιστικά
          base: ""
          # Ενεργοποιεί μόνο το πρόσθετο των γλωσσών
          plugin_languages: yes
          plugin_languages_ignored: html, css  # Αγνοεί HTML/CSS
          plugin_languages_details: percentage # Εμφανίζει ποσοστά και μπάρες
